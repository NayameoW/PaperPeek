<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- PaperPeek：两页并排（双页阅读），右页琥珀色的一行是可悬停预览的引用链接。
       48/128px 和网页里用这一版；16/32px 用 icon-small.svg（对齐像素网格、去掉阴影）。 -->
  <defs>
    <linearGradient id="pv-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a88f2"/>
      <stop offset="1" stop-color="#2860cc"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#pv-tile)"/>
  <g fill="#1b4aa6">
    <rect x="20" y="32" width="36" height="64" rx="6"/>
    <rect x="72" y="32" width="36" height="64" rx="6"/>
  </g>
  <g fill="#fff">
    <rect x="20" y="28" width="36" height="64" rx="6"/>
    <rect x="72" y="28" width="36" height="64" rx="6"/>
  </g>
  <g fill="#2f6fde">
    <rect x="26" y="38" width="24" height="6" rx="3"/>
    <rect x="26" y="51" width="24" height="6" rx="3"/>
    <rect x="26" y="64" width="24" height="6" rx="3"/>
    <rect x="26" y="77" width="14" height="6" rx="3"/>
    <rect x="78" y="38" width="24" height="6" rx="3"/>
    <rect x="78" y="64" width="24" height="6" rx="3"/>
    <rect x="78" y="77" width="14" height="6" rx="3"/>
  </g>
  <rect x="78" y="51" width="24" height="6" rx="3" fill="#ff9f0a"/>
</svg>
