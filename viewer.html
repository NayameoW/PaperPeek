<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaperPeek</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon-small.svg">
  <link rel="alternate icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="stylesheet" href="vendor/pdfjs/web/pdf_viewer.css">
  <link rel="stylesheet" href="viewer.css">
  <!-- 同步加载：文档解析完立刻按当前语言替换下面的中文文案（见 i18n.js） -->
  <script src="i18n.js"></script>
</head>
<body>
  <header id="toolbar">
    <button id="btnSidebar" class="icon" title="目录（PDF 书签）" data-i18n-title="sidebar.title" aria-pressed="false">
      <svg viewBox="0 0 20 20" width="18" height="18"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
    </button>
    <button id="btnOpen" title="打开本地 PDF" data-i18n-title="open.title" data-i18n="open.label">打开文件</button>
    <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
    <form id="urlForm">
      <input id="urlInput" type="text" spellcheck="false" autocomplete="off"
             placeholder="粘贴 PDF 链接或 arXiv 编号（如 1706.03762），回车打开" data-i18n-placeholder="url.placeholder">
    </form>

    <div class="seg" id="modeGroup" role="radiogroup" aria-label="页面布局" data-i18n-aria-label="mode.aria">
      <button data-spread="0" role="radio" title="单页" data-i18n-title="mode.single.title" data-i18n="mode.single">单页</button>
      <button data-spread="1" role="radio" title="双页：1-2、3-4 …" data-i18n-title="mode.double.title" data-i18n="mode.double">双页</button>
      <button data-spread="2" role="radio" title="双页，第一页（封面）单独显示：1、2-3、4-5 …" data-i18n-title="mode.cover.title" data-i18n="mode.cover">双页 · 封面单独</button>
    </div>

    <div class="group">
      <button id="btnZoomOut" class="icon" title="缩小" data-i18n-title="zoom.out">−</button>
      <select id="scaleSelect" title="缩放" data-i18n-title="zoom.title">
        <option value="page-fit" data-i18n="zoom.fit">适合页面</option>
        <option value="page-width" data-i18n="zoom.width">适合宽度</option>
        <option value="auto" data-i18n="zoom.auto">自动</option>
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
        <option value="3">300%</option>
        <option value="custom" hidden></option>
      </select>
      <button id="btnZoomIn" class="icon" title="放大" data-i18n-title="zoom.in">+</button>
    </div>

    <div class="group">
      <input id="pageInput" type="text" inputmode="numeric" title="页码" data-i18n-title="page.title" value="">
      <span id="pageCount">/ –</span>
    </div>

    <button id="btnFind" class="icon" title="页内搜索" data-i18n-title="find.title">
      <svg viewBox="0 0 20 20" width="17" height="17"><circle cx="8.5" cy="8.5" r="5.2" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M12.6 12.6 17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <button id="btnDownload" class="icon" title="下载 PDF（Ctrl/⌘ + S）" data-i18n-title="download.title" disabled>
      <svg viewBox="0 0 20 20" width="17" height="17"><path d="M10 3v9.5M6 8.8l4 4 4-4M4 16h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
    <select id="langSelect" title="界面语言" data-i18n-title="lang.title">
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
    <div id="progress"><div id="progressBar"></div></div>
  </header>

  <div id="findbar" hidden>
    <input id="findInput" type="text" placeholder="在文档中查找" data-i18n-placeholder="find.placeholder" spellcheck="false">
    <span id="findCount"></span>
    <button id="findPrev" class="icon" title="上一个" data-i18n-title="find.prev">↑</button>
    <button id="findNext" class="icon" title="下一个" data-i18n-title="find.next">↓</button>
    <label><input type="checkbox" id="findCase"> <span data-i18n="find.case">区分大小写</span></label>
    <button id="findClose" class="icon" title="关闭" data-i18n-title="find.close">✕</button>
  </div>

  <aside id="sidebar" hidden>
    <div class="side-title" data-i18n="outline.title">目录</div>
    <div id="outline"></div>
  </aside>

  <!-- lang="" 不能省：文字层的字体必须和 pdf.js 量字宽时用的一致，不能继承页面的 zh-CN，否则选区和搜索高亮会错位。
       要加在外层容器上，#viewer 上的 lang 会在打开文档时被 pdf.js 清掉。 -->
  <div id="viewerContainer" tabindex="0" lang="">
    <div id="viewer" class="pdfViewer"></div>
  </div>

  <div id="welcome">
    <div class="welcome-card">
      <img class="welcome-logo" src="icons/icon.svg" alt="" width="72" height="72">
      <div class="welcome-title" data-i18n="welcome.title">把 PDF 拖到这里</div>
      <div class="welcome-sub" data-i18n="welcome.sub">或点击左上角「打开文件」，或在上方粘贴链接 / arXiv 编号</div>
    </div>
  </div>
  <div id="dropOverlay" hidden><div data-i18n="drop.overlay">松开鼠标以打开 PDF</div></div>

  <div id="popup" hidden>
    <div class="pv-head">
      <span class="pv-kind"></span>
      <span class="pv-page"></span>
      <span class="pv-hint" data-i18n="popup.hint">点击预览跳转</span>
    </div>
    <div class="pv-body" title=""></div>
  </div>

  <button id="backBtn" hidden title="返回跳转前的位置（Alt + ←）" data-i18n-title="back.title">
    <span class="arrow">↩</span> <span data-i18n="back.label">返回原位置</span> <kbd>Alt ←</kbd>
  </button>
  <div id="toast" hidden></div>

  <script type="module" src="viewer.js"></script>
</body>
</html>
